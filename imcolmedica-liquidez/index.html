<header><h1>Imcolmedica S.A. · Herramienta de liquidez y flujo de caja</h1>
<p class="sub">Propuesta de mejoramiento de la operación financiera 2024-2025. Todas las cifras en millones de pesos colombianos (MM COP). Los cálculos se actualizan al instante con los datos de la pestaña «Datos».</p></header>
<nav id="nav" role="tablist"></nav><main id="m"></main>
<script>
const E=[['ing','Ingresos operacionales'],['cv','Costo de ventas'],['gv','Gastos de ventas'],['ga','Gastos de administración'],['otr','Otros ingresos/(gastos) operacionales, neto'],['dep','Depreciación y amortización (informativa; ya incluida en costos y gastos)'],['ifi','Ingresos financieros'],['gf','Gastos financieros'],['imp','Impuesto de renta']];
const B=[['efe','Efectivo y equivalentes'],['cxc','Cuentas por cobrar comerciales'],['inv','Inventarios'],['oac','Otros activos corrientes'],['ppe','Propiedad, planta y equipo neto'],['oanc','Otros activos no corrientes'],['ofcp','Obligaciones financieras de corto plazo'],['prov','Proveedores y cuentas por pagar comerciales'],['opc','Otros pasivos corrientes'],['plp','Pasivos no corrientes'],['pat','Patrimonio']];
const X=[['fco','Flujo de efectivo operativo (FCO)'],['capex','Inversión en activos fijos, CAPEX (valor positivo)'],['fci','Flujo de inversión total (con signo)'],['ffin','Flujo de financiación (con signo)']];
const DEMO={y24:{ing:53938,cv:40400,gv:6000,ga:4200,otr:0,dep:900,ifi:100,gf:1500,imp:678,efe:5600,cxc:10032,inv:36800,oac:2500,ppe:18300,oanc:12500,ofcp:17500,prov:9800,opc:4200,plp:14232,pat:40000,fco:1200,capex:800,fci:-800,ffin:0},
y25:{ing:60000,cv:44456,gv:6879,ga:4400,otr:0,dep:950,ifi:100,gf:2100,imp:793,efe:3200,cxc:12415,inv:40317,oac:2800,ppe:18000,oanc:13000,ofcp:22000,prov:9500,opc:4500,plp:12260,pat:41472,fco:-3000,capex:1000,fci:-1000,ffin:1600}};
const V0={rf:4.3,beta:0.85,prima:5.5,rp:2.5,icop:5.1,iusd:2.5,kd:13,t:35,wd:35,g1:8,g2:8,g3:7,g4:6,g5:5,gt:3.5,dm:0,dso:60,dio:240,dpo:90,yrs:3,deu:''};
const LS='imc_liquidez_v1';let S,tab=0;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!S.d)S={demo:true,d:JSON.parse(JSON.stringify(DEMO)),v:{...V0}};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const num=(y,k)=>+S.d[y][k]||0,dv=(a,b)=>b?a/b:NaN,fin=isFinite;
const f0=n=>fin(n)?Math.round(n).toLocaleString('es-CO'):'n/d';
const pc=n=>fin(n)?(n*100).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' %':'n/d';
const x2=n=>fin(n)?n.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2}):'n/d';
const d1=n=>fin(n)?n.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1}):'n/d';
const sg=(s,n)=>`<span class="${n<0?'neg':''}">${s}</span>`;
function c(y){const o={};[...E,...B,...X].forEach(([k])=>o[k]=num(y,k));
o.ub=o.ing-o.cv;o.uo=o.ub-o.gv-o.ga+o.otr;o.ebitda=o.uo+o.dep;o.uai=o.uo+o.ifi-o.gf;o.un=o.uai-o.imp;
o.ac=o.efe+o.cxc+o.inv+o.oac;o.at=o.ac+o.ppe+o.oanc;o.pc=o.ofcp+o.prov+o.opc;o.pt=o.pc+o.plp;o.ptp=o.pt+o.pat;o.vne=o.fco+o.fci+o.ffin;
o.rc=dv(o.ac,o.pc);o.pa=dv(o.ac-o.inv,o.pc);o.kt=o.ac-o.pc;o.ktno=o.cxc+o.inv-o.prov;
o.dso=dv(o.cxc,o.ing)*365;o.dio=dv(o.inv,o.cv)*365;o.dpo=dv(o.prov,o.cv)*365;o.ccc=o.dso+o.dio-o.dpo;
o.fcl=o.fco-o.capex;o.cal=dv(o.fco,o.un);return o}
const tbl=(h,r)=>`<div class="sc"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(q=>`<tr class="${q.b?'b':''}">${q.t.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function stmt(title,rows,base){const a=c('y24'),b=c('y25');
return `<h3>${title}</h3>`+tbl(['Concepto','2024','% vertical','2025','% vertical','Δ $ (horiz.)','Δ % (horiz.)'],rows.map(([l,k,s])=>{const A=a[k],Bv=b[k],d=Bv-A;return{b:s,t:[l,sg(f0(A),A),pc(dv(A,a[base])),sg(f0(Bv),Bv),pc(dv(Bv,b[base])),sg(f0(d),d),sg(pc(dv(d,Math.abs(A))),d)]}}))}
function checks(){const a=c('y24'),b=c('y25'),m=[];
[['2024',a],['2025',b]].forEach(([y,o])=>{const d=o.at-o.ptp;m.push(Math.abs(d)<1?`Balance ${y}: cuadra (Activo = Pasivo + Patrimonio).`:`<b class="neg">Balance ${y}: descuadre de ${f0(d)} MM (Activo − Pasivo − Patrimonio). Revise las cifras.</b>`)});
const de=b.efe-a.efe,df=b.vne-de;m.push(Math.abs(df)<1?'Flujo 2025: FCO + inversión + financiación = variación del efectivo.':`<b class="neg">Flujo 2025: FCO + inversión + financiación (${f0(b.vne)}) ≠ variación del efectivo en balance (${f0(de)}); diferencia ${f0(df)} MM.</b>`);
return m.join('<br>')}
function dataTab(){const row=(l,k)=>`<tr><td>${l}</td>${['y24','y25'].map(y=>`<td><input type="number" step="any" data-y="${y}" data-k="${k}" value="${S.d[y][k]===''||S.d[y][k]==null?'':S.d[y][k]}"></td>`).join('')}</tr>`;
const t=(n,L)=>`<h3>${n}</h3><div class="sc"><table><thead><tr><th>Concepto</th><th>2024</th><th>2025</th></tr></thead><tbody>${L.map(([k,l])=>row(l,k)).join('')}</tbody></table></div>`;
return `${S.demo?'<div class="bn er"><b>Datos de demostración.</b> Las cifras precargadas son ilustrativas: solo reproducen los indicadores de la propuesta (cuentas por cobrar 12.415 MM, +23,76 %; ventas +11,24 %; costo de ventas +10,04 %; gasto de venta +14,65 %; inventarios 44,93 % del activo y 331 días). No son los estados financieros de Imcolmedica. Pulse «Vaciar todo» e ingrese las cifras de los estados financieros IFRS 2024 y 2025 (Superintendencia de Sociedades).</div>':''}
<button class="btn" id="bd">Cargar datos de demostración</button><button class="btn s" id="bv">Vaciar todo</button><button class="btn s" id="bx">Exportar datos (JSON)</button><button class="btn s" id="bi">Importar datos (JSON)</button><div id="ex"></div>
<div class="cd"><b>Verificaciones de coherencia</b><div id="ck" class="note" style="margin-top:6px">${checks()}</div></div>
${t('Estado de resultados',E)}${t('Balance general',B)}${t('Flujo de efectivo',X)}
<p class="note">Los datos se guardan en este navegador. Los totales, razones y proyecciones se calculan automáticamente.</p>`}
function horiz(){return `<h2>Objetivo 1 · Análisis horizontal y vertical 2024-2025</h2><p class="note">Vertical: estado de resultados y flujo sobre ingresos; balance sobre activo total. Horizontal: variación absoluta y porcentual 2025 frente a 2024.</p>`+
stmt('Estado de resultados',[['Ingresos operacionales','ing'],['Costo de ventas','cv'],['Utilidad bruta','ub',1],['Gastos de ventas','gv'],['Gastos de administración','ga'],['Otros operacionales, neto','otr'],['Utilidad operacional','uo',1],['EBITDA','ebitda',1],['Ingresos financieros','ifi'],['Gastos financieros','gf'],['Utilidad antes de impuestos','uai',1],['Impuesto de renta','imp'],['Utilidad neta','un',1]],'ing')+
stmt('Balance general',[['Efectivo','efe'],['Cuentas por cobrar','cxc'],['Inventarios','inv'],['Otros activos corrientes','oac'],['Activo corriente','ac',1],['PP&E neto','ppe'],['Otros activos no corrientes','oanc'],['Activo total','at',1],['Obligaciones financieras CP','ofcp'],['Proveedores','prov'],['Otros pasivos corrientes','opc'],['Pasivo corriente','pc',1],['Pasivos no corrientes','plp'],['Pasivo total','pt',1],['Patrimonio','pat',1]],'at')+
stmt('Flujo de efectivo',[['Flujo operativo (FCO)','fco',1],['CAPEX','capex'],['Flujo de inversión','fci'],['Flujo de financiación','ffin'],['Variación neta del efectivo','vne',1],['Flujo de caja libre (FCO − CAPEX)','fcl',1]],'ing')}
function drivers(){const a=c('y24'),b=c('y25'),it=[['Costo de ventas','cv'],['Utilidad bruta','ub'],['Gastos de ventas','gv'],['Gastos de administración','ga'],['Utilidad operacional','uo'],['EBITDA','ebitda'],['Gastos financieros','gf'],['Utilidad neta','un']];
const mb0=dv(a.ub,a.ing),mb1=dv(b.ub,b.ing),vol=(b.ing-a.ing)*mb0,mar=b.ing*(mb1-mb0),dun=b.un-a.un;
const w=[['Δ Utilidad bruta',b.ub-a.ub,1],['  (−) Δ Gastos de ventas',-(b.gv-a.gv)],['  (−) Δ Gastos de administración',-(b.ga-a.ga)],['  (+) Δ Otros operacionales',b.otr-a.otr],['= Δ Utilidad operacional',b.uo-a.uo,1],['  (+) Δ Ingresos financieros',b.ifi-a.ifi],['  (−) Δ Gastos financieros',-(b.gf-a.gf)],['  (−) Δ Impuesto',-(b.imp-a.imp)],['= Δ Utilidad neta',dun,1]];
return `<h2>Objetivo 2 · Impulsores de ingresos, costos y utilidades</h2>
<h3>Estructura de costos y márgenes (% de ingresos)</h3>`+tbl(['Partida','2024','2025','Δ puntos porcentuales','Crecimiento 2025'],it.map(([l,k])=>[l,pc(dv(a[k],a.ing)),pc(dv(b[k],b.ing)),sg(d1((dv(b[k],b.ing)-dv(a[k],a.ing))*100)+' pp',dv(b[k],b.ing)-dv(a[k],a.ing)),pc(dv(b[k]-a[k],Math.abs(a[k])))]).map(t=>({t,b:/Utilidad|EBITDA/.test(t[0])})))+
`<h3>Descomposición de la utilidad bruta</h3>`+tbl(['Efecto','MM COP'],[{t:['Efecto volumen: Δ ingresos × margen bruto 2024',sg(f0(vol),vol)]},{t:['Efecto margen: ingresos 2025 × Δ margen bruto',sg(f0(mar),mar)]},{b:1,t:['Δ Utilidad bruta total',sg(f0(vol+mar),vol+mar)]}])+
`<h3>Puente de la variación de la utilidad neta 2024 → 2025</h3>`+tbl(['Partida','Aporte (MM COP)','% de la Δ utilidad neta'],w.map(([l,v,s])=>({b:s,t:[l,sg(f0(v),v),pc(dv(v,Math.abs(dun)))]})))+
`<p class="note">Lectura: si los gastos de venta crecen más que los ingresos, parte del margen bruto se consume antes de llegar a la utilidad operacional; si los gastos financieros crecen, el costo de financiar cartera e inventarios reduce la utilidad neta.</p>`}
function liq(){const a=c('y24'),b=c('y25');
const r=[['Razón corriente (veces)',a.rc,b.rc,x2],['Prueba ácida (veces)',a.pa,b.pa,x2],['Capital de trabajo contable (MM)',a.kt,b.kt,f0],['KTNO: cartera + inventarios − proveedores (MM)',a.ktno,b.ktno,f0],['KTNO como % de ingresos',dv(a.ktno,a.ing),dv(b.ktno,b.ing),pc],['Días de cartera (DSO)',a.dso,b.dso,d1],['Días de inventario (DIO)',a.dio,b.dio,d1],['Días de proveedores (DPO)',a.dpo,b.dpo,d1],['Ciclo de conversión de efectivo (días)',a.ccc,b.ccc,d1],['Rotación de cartera (veces)',dv(a.ing,a.cxc),dv(b.ing,b.cxc),x2],['Rotación de inventarios (veces)',dv(a.cv,a.inv),dv(b.cv,b.inv),x2],['Utilidad neta (MM)',a.un,b.un,f0],['Flujo operativo FCO (MM)',a.fco,b.fco,f0],['Calidad de la utilidad: FCO / utilidad neta (veces)',a.cal,b.cal,x2],['Flujo de caja libre FCO − CAPEX (MM)',a.fcl,b.fcl,f0]];
const dB=b.cxc-a.cxc,dI=b.inv-a.inv,dP=b.prov-a.prov,est=b.un+b.dep-dB-dI+dP;
const tot=Math.max(b.dso+b.dio,1),bar=`<div class="bar"><span style="width:${b.dso/tot*100}%;background:#2f7fb8">Cartera ${d1(b.dso)} d</span><span style="width:${b.dio/tot*100}%;background:#0f6b5c">Inventario ${d1(b.dio)} d</span></div><div class="note">Ciclo operativo (DSO + DIO) = ${d1(b.dso+b.dio)} días; se financian ${d1(b.dpo)} días con proveedores, el resto (${d1(b.ccc)} días) con deuda o patrimonio.</div>`;
return `<h2>Objetivo 3 · Flujo operativo y ciclo de conversión de efectivo</h2><p class="note">Días calculados sobre saldos al cierre y año de 365 días (con un solo corte anual no hay promedios). DSO = cartera/ingresos×365; DIO = inventarios/costo de ventas×365; DPO = proveedores/costo de ventas×365.</p>`+tbl(['Indicador','2024','2025','Cambio'],r.map(([l,x,y,f])=>({b:/Ciclo|FCO|Calidad/.test(l),t:[l,f(x),f(y),sg(f(y-x),y-x)]})))+bar+
`<h3>Del resultado contable al flujo operativo 2025 (estimación indirecta con saldos de balance)</h3>`+tbl(['Concepto','MM COP'],[{t:['Utilidad neta',f0(b.un)]},{t:['(+) Depreciación y amortización',f0(b.dep)]},{t:['(−) Aumento de cuentas por cobrar',sg(f0(-dB),-dB)]},{t:['(−) Aumento de inventarios',sg(f0(-dI),-dI)]},{t:['(+) Aumento de proveedores',sg(f0(dP),dP)]},{b:1,t:['FCO estimado antes de otros rubros',sg(f0(est),est)]},{t:['FCO reportado',sg(f0(b.fco),b.fco)]},{t:['Diferencia (otros pasivos, impuestos, intereses, otros)',sg(f0(b.fco-est),b.fco-est)]}])}
const sem=(v,o,w,hb)=>{if(!fin(v))return'<span class="dot" style="background:var(--mu)"></span>n/d';const g=hb?v>=o:v<=o,y=hb?v>=w:v<=w;const[c1,t]=g?['var(--ok)','Bajo']:y?['var(--wa)','Atención']:['var(--bd)','Alto'];return`<span class="dot" style="background:${c1}"></span>${t}`};
function risk(){const a=c('y24'),b=c('y25');
const r=[['Razón corriente',a.rc,b.rc,x2,'Alto < 1,0 · Atención 1,0-1,5 · Bajo ≥ 1,5',1.5,1,1],['Prueba ácida',a.pa,b.pa,x2,'Alto < 0,7 · Atención 0,7-1,0 · Bajo ≥ 1,0',1,0.7,1],['Días de cartera',a.dso,b.dso,d1,'Bajo ≤ 45 · Atención ≤ 75 · Alto > 75',45,75,0],['Días de inventario',a.dio,b.dio,d1,'Bajo ≤ 120 · Atención ≤ 200 · Alto > 200',120,200,0],['Ciclo de conversión (días)',a.ccc,b.ccc,d1,'Bajo ≤ 90 · Atención ≤ 150 · Alto > 150',90,150,0],['Calidad utilidad FCO/UN',a.cal,b.cal,x2,'Alto < 0 · Atención 0-1 · Bajo ≥ 1',1,0,1],['Deuda CP / pasivo total',dv(a.ofcp,a.pt),dv(b.ofcp,b.pt),pc,'Bajo ≤ 30 % · Atención ≤ 50 % · Alto > 50 %',.3,.5,0],['Deuda financiera total / EBITDA (veces)',dv(a.ofcp+a.plp,a.ebitda),dv(b.ofcp+b.plp,b.ebitda),x2,'Bajo ≤ 3 · Atención ≤ 4,5 · Alto > 4,5 (supone que los pasivos no corrientes son deuda)',3,4.5,0],['Cobertura de intereses EBIT / gastos financieros',dv(a.uo,a.gf),dv(b.uo,b.gf),x2,'Alto < 1,5 · Atención 1,5-3 · Bajo ≥ 3',3,1.5,1],['Endeudamiento total (pasivo/activo)',dv(a.pt,a.at),dv(b.pt,b.at),pc,'Bajo ≤ 50 % · Atención ≤ 65 % · Alto > 65 %',.5,.65,0]];
return `<h2>Objetivo 4 · Riesgos financieros: liquidez, cartera y endeudamiento de corto plazo</h2><p class="note">Los umbrales son referencias generales de análisis financiero, no normas; ajústelos al promedio del sector (CIIU 4669) cuando disponga de benchmarks. El semáforo evalúa 2025.</p>`+tbl(['Indicador','2024','2025','Nivel de riesgo 2025','Umbral de referencia'],r.map(([l,x,y,f,u,o,w,h])=>({t:[l,f(x),f(y),`<span style="text-align:left;display:inline-block">${sem(y,o,w,h)}</span>`,`<span class="note">${u}</span>`]})))}
function val(sc,w,gT){const b=c('y25'),V=S.v,p=k=>(+V[k]||0)/100;
const mb=dv(b.ub,b.ing)+p('dm'),gvp=dv(b.gv,b.ing),gap=dv(b.ga,b.ing),dp=dv(b.dep,b.ing),cp=dv(b.capex,b.ing),tx=p('t');
const d0=[dv(b.cxc,b.ing)*365,dv(b.inv,b.cv)*365,dv(b.prov,b.cv)*365],tg=[V.dso,V.dio,V.dpo].map((x,i)=>x===''||!fin(+x)?d0[i]:+x),yr=Math.max(+V.yrs||1,1);
let ing=b.ing,kp=b.ktno,pv=0,rows=[],nopD,kn;
for(let t=1;t<=5;t++){ing*=1+p('g'+t);const cv=ing*(1-mb),k=Math.min(t/yr,1),d=d0.map((x,i)=>sc?x+(tg[i]-x)*k:x);
kn=d[0]*ing/365+(d[1]-d[2])*cv/365;const ebit=ing*(mb-gvp-gap),nop=ebit-Math.max(ebit,0)*tx,dep=ing*dp,cx=ing*cp,f=nop+dep-cx-(kn-kp);
rows.push({t,ing,ebit,ebitda:ebit+dep,nop,dep,cx,dk:kn-kp,kn,f});kp=kn;pv+=f/Math.pow(1+w,t);nopD=nop+dep-cx}
